<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicle OS v1.5 - Retro Terminal Journal & AI (Perf Optimized)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Line Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Monospace Font: JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Modular Styles -->
    <link rel="stylesheet" href="css/styles.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'term-bg': '#EDEAE3',
                        'term-frame': '#1F2430',
                        'term-text': '#2B2B2B',
                        'term-muted': '#8A8A85',
                        'term-border': '#3D3D3A',
                        'term-accent': '#2C5E3B',
                        'term-warn': '#B91C1C',
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'Consolas', 'Courier New', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen w-screen overflow-hidden p-2 sm:p-4 select-none">

    <!-- Main Shell Frame Container -->
    <div id="app" class="h-full w-full border-2 border-term-frame bg-term-bg flex flex-col terminal-box-shadow relative overflow-hidden">
        
        <!-- Top Status Bar (Retro Terminal OS Header) -->
        <header class="h-10 border-b-2 border-term-frame flex items-center justify-between px-3 shrink-0 bg-term-bg">
            <div class="flex items-center gap-2">
                <button onclick="toggleSidebar()" class="md:hidden p-1.5 text-term-frame hover:bg-term-frame hover:text-term-bg">
                    <i class="fa-solid fa-bars text-sm"></i>
                </button>
                <span class="font-mono text-sm font-bold tracking-tight text-term-frame">CHRONICLE_OS_v1.5</span>
            </div>
            <div class="flex items-center gap-3 text-xs">
                <span id="statusBadge" class="font-mono">
                    <span class="text-term-muted">AI:</span>
                    <span id="statusText" class="font-bold ml-1 text-emerald-800">READY</span>
                </span>
                <span id="systemClock" class="font-mono text-term-text font-medium">2026-09-15 22:30:00</span>
            </div>
        </header>

        <!-- Main Workspace Grid -->
        <div class="flex-1 flex overflow-hidden relative">
            
            <!-- Mobile Sidebar Backdrop Overlay -->
            <div id="sidebarOverlay" class="fixed inset-0 bg-term-frame/40 z-20 hidden md:hidden backdrop-blur-sm gpu-layer" onclick="toggleSidebar()"></div>

            <!-- Left Navigation Sidebar -->
            <aside id="sidebar" class="absolute md:relative inset-y-0 left-0 z-30 w-72 border-r-2 border-term-frame bg-term-bg flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out shrink-0 gpu-layer">
                
                <!-- Sidebar Header -->
                <div class="p-3 border-b-2 border-term-frame flex items-center justify-between">
                    <span class="text-xs font-bold text-term-frame uppercase tracking-wider">
                        > navigation/
                    </span>
                    <button onclick="toggleSidebar()" class="md:hidden p-1 text-term-frame hover:bg-term-frame hover:text-term-bg">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </div>

                <!-- Action Controls Section -->
                <div class="p-3 border-b border-term-border space-y-2">
                    <button onclick="createNewThread()" class="btn-terminal w-full justify-center">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>> new_thread</span>
                    </button>
                    
                    <div class="grid grid-cols-2 gap-1.5 pt-1">
                        <button onclick="openTimeMachineModal()" class="btn-terminal text-[11px] justify-center text-amber-900 border-amber-900">
                            <i class="fa-solid fa-clock-rotate-left text-[10px]"></i>
                            <span>[這天你在想什麼]</span>
                        </button>
                        <button onclick="openStatsModal()" class="btn-terminal text-[11px] justify-center">
                            <i class="fa-solid fa-chart-line text-[10px]"></i>
                            <span>[週/月報洞察]</span>
                        </button>
                    </div>
                </div>

                <!-- Search -->
                <div class="p-3 border-b border-term-border">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-term-muted text-xs"></i>
                        <input type="text" id="searchInput" placeholder="search threads..." 
                            class="w-full pl-8 pr-3 py-1.5 text-xs font-mono bg-transparent border border-term-border focus:border-term-frame outline-none"
                            oninput="debouncedHandleSearch(this.value)">
                    </div>
                </div>

                <!-- Tag Filter -->
                <div id="tagFilterBar" class="px-3 py-2 border-b border-term-border flex flex-wrap gap-1 overflow-x-auto"></div>

                <!-- Threads List -->
                <div id="threadsList" class="flex-1 overflow-y-auto p-2 space-y-1"></div>

                <!-- Sidebar Footer -->
                <div class="p-3 border-t-2 border-term-frame space-y-1.5">
                    <button onclick="openAiConfigModal()" class="btn-terminal w-full justify-center text-xs">
                        <i class="fa-solid fa-key text-[10px]"></i>
                        <span>[ai_config]</span>
                    </button>
                    <button onclick="exportData()" class="btn-terminal w-full justify-center text-xs">
                        <i class="fa-solid fa-download text-[10px]"></i>
                        <span>[export]</span>
                    </button>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="flex-1 flex flex-col overflow-hidden relative">
                <!-- Thread Header -->
                <div id="threadHeader" class="h-12 border-b border-term-border flex items-center justify-between px-4 shrink-0">
                    <div class="flex items-center gap-2 min-w-0">
                        <h2 id="currentThreadTitle" class="font-mono text-sm font-semibold truncate text-term-frame">Select a thread</h2>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="toggleAiChatDrawer()" class="btn-terminal text-xs px-2">
                            <i class="fa-solid fa-robot text-[10px]"></i>
                            <span>AI</span>
                        </button>
                        <button onclick="deleteCurrentThread()" class="btn-terminal text-xs px-2 text-term-warn border-term-warn">
                            <i class="fa-solid fa-trash text-[10px]"></i>
                        </button>
                    </div>
                </div>

                <!-- Entries Area -->
                <div id="entriesContainer" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

                <!-- Input Area -->
                <div class="border-t-2 border-term-frame p-3 shrink-0">
                    <div class="flex gap-2">
                        <textarea id="entryInput" rows="2" placeholder="> write your entry..." 
                            class="flex-1 font-mono text-sm bg-transparent border border-term-border focus:border-term-frame outline-none p-2 resize-none"
                            onkeydown="handleEntryKey(event)"></textarea>
                        <button onclick="submitEntry()" class="btn-terminal self-end px-4">
                            <i class="fa-solid fa-paper-plane text-xs"></i>
                        </button>
                    </div>
                </div>
            </main>

            <!-- AI Chat Drawer -->
            <div id="aiChatDrawer" class="absolute right-0 top-0 bottom-0 w-80 border-l-2 border-term-frame bg-term-bg flex flex-col transform translate-x-full transition-transform duration-200 z-40 hidden md:flex">
                <div class="p-3 border-b-2 border-term-frame flex items-center justify-between">
                    <span class="text-xs font-bold uppercase tracking-wider">AI Chat</span>
                    <button onclick="toggleAiChatDrawer()" class="p-1 hover:bg-term-frame hover:text-term-bg">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </div>
                <div class="flex gap-1 p-2 border-b border-term-border">
                    <button id="aiModeCurrentBtn" onclick="setAiChatScope('current')" class="btn-terminal text-[10px] flex-1 btn-terminal-active">Current</button>
                    <button id="aiModeGlobalBtn" onclick="setAiChatScope('global')" class="btn-terminal text-[10px] flex-1">Global</button>
                </div>
                <div id="aiChatMessages" class="flex-1 overflow-y-auto p-3 space-y-2 text-xs font-mono"></div>
                <div class="p-2 border-t border-term-border">
                    <input type="text" id="aiChatInput" placeholder="Ask AI..." class="w-full text-xs font-mono p-2 border border-term-border outline-none" onkeydown="handleAiChatKey(event)">
                </div>
            </div>
        </div>
    </div>

    <!-- Modals would be here in full version -->
    <script src="js/utils.js"></script>
    <script src="js/state.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/threads.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/fileops.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
